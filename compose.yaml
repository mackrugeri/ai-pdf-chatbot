name: ai-pdf-chatbot

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aipdf}
      POSTGRES_DB: ${POSTGRES_DB:-aipdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    shm_size: 128mb
    mem_limit: 512m

  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q "^PONG$"']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  rabbitmq:
    <<: *service-defaults
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine@sha256:fa8746831e6096fc9111365960e1e56871dd5d0d362af67fd48bd8d156aba818}
    profiles: [jobs]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aipdf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-aipdf}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 768m

  chroma:
    <<: *service-defaults
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6}
    profiles: [vectors]
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma-data:/data
    mem_limit: 1g

  ollama:
    <<: *service-defaults
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754}
    profiles: [models]
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    # CPU-only by default. Native Ollama is also supported on the host.

  api:
    build:
      context: .
      target: runtime
    image: ai-pdf-chatbot:dev
    profiles: [api]
    env_file:
      - path: .env
        required: false
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aipdf}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aipdf}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The API shell does not open service connections or report ready yet.

  workspace:
    build:
      context: .
      target: runtime
    image: ai-pdf-chatbot:dev
    profiles: [dev]
    env_file:
      - path: .env
        required: false
    init: true
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MODEL_BACKEND: ${MODEL_BACKEND:-fake}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aipdf}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aipdf}
      BROKER_URL: amqp://${RABBITMQ_USER:-aipdf}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/${RABBITMQ_VHOST:-aipdf}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      OLLAMA_GENERATION_URL: ${OLLAMA_GENERATION_URL:-http://host.docker.internal:11434}
      OLLAMA_QUERY_EMBEDDING_URL: ${OLLAMA_QUERY_EMBEDDING_URL:-http://host.docker.internal:11434}
      OLLAMA_INGESTION_EMBEDDING_URL: ${OLLAMA_INGESTION_EMBEDDING_URL:-http://host.docker.internal:11434}
      GENERATION_MODEL: qwen3:4b
      EMBEDDING_MODEL: nomic-embed-text
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: .
        target: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  chroma-data:
  ollama-data:
